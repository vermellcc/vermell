name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.MD'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENCE'
      - '.gitignore'
      - '.deepsource.toml'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.MD'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENCE'
      - '.gitignore'
      - '.deepsource.toml'

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-debug-asan-ubsan
            cxx: g++
            build: Debug
            deps: "sudo apt-get update && sudo apt-get install -y libgtest-dev libcurl4-openssl-dev"
          - name: clang-debug-asan-ubsan
            cxx: clang++
            build: Debug
            deps: "sudo apt-get update && sudo apt-get install -y clang libgtest-dev libcurl4-openssl-dev"
          - name: gcc-release
            cxx: g++
            build: Release
            deps: "sudo apt-get update && sudo apt-get install -y libgtest-dev libcurl4-openssl-dev"

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: ${{ matrix.deps }}

    - name: Configure CMake
      env:
        CXX: ${{ matrix.cxx }}
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DTESTING=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{ matrix.build }} -j2

    - name: Test
      working-directory: ${{github.workspace}}/build
      env:
        ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1
      run: ctest -C ${{ matrix.build }} --output-on-failure
