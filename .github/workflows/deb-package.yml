name: Build & publish Debian packages (.deb + apt repo)

on:
  release:
    types: [ published ]
  workflow_dispatch:

# Least privilege per job.
permissions: {}

jobs:
  build-deb:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            toolchain: ""
            cross_pkg: ""
          - arch: arm64
            toolchain: cmake/aarch64-linux-gnu.cmake
            cross_pkg: g++-aarch64-linux-gnu
          - arch: armhf
            toolchain: cmake/arm-linux-gnueabihf.cmake
            cross_pkg: g++-arm-linux-gnueabihf

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake dpkg-dev apt-utils gnupg \
            ${{ matrix.cross_pkg }}

      - name: Derive version from tag
        id: version
        # Via env, not ${{ }} in run: (script injection, CWE-94).
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="$RELEASE_TAG"
          elif [ "$EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            # manual run: latest reachable tag, e.g. v1.0.5 -> 1.0.5
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo '0.0.0')"
          fi
          VERSION="${VERSION#v}"
          # Semver only.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.+~-][0-9A-Za-z.+~-]+)?$'; then
            echo "::error::invalid version string"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure CMake (Release, native)
        if: matrix.toolchain == ''
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCPACK_PACKAGE_VERSION=${{ steps.version.outputs.version }} \
            -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=${{ matrix.arch }}

      - name: Configure CMake (Release, cross-compiled)
        if: matrix.toolchain != ''
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCPACK_PACKAGE_VERSION=${{ steps.version.outputs.version }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }} \
            -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=${{ matrix.arch }}

      - name: Build
        run: cmake --build build --parallel

      - name: Generate .deb with CPack
        run: cpack --config build/CPackConfig.cmake -B build

      - name: Inspect package
        run: |
          ls -la build/*.deb
          dpkg-deb --info build/*.deb

      - name: Upload .deb as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libvermell-deb-${{ matrix.arch }}
          path: build/*.deb
          if-no-files-found: error

  attach-release:
    name: Attach .deb files to GitHub Release
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all .deb artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: libvermell-deb-*
          merge-multiple: true
          path: debs

      - name: Attach to Release (gh CLI)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            RELEASE_TAG="$EVENT_RELEASE_TAG"
          elif [ "$EVENT_NAME" = "push" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Attaching .deb files to release: $RELEASE_TAG"
            gh release upload "$RELEASE_TAG" debs/*.deb --clobber
          else
            echo "::notice::Release $RELEASE_TAG not found - skipping attach"
          fi

  publish-pages:
    name: Publish apt repository to GitHub Pages
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download all .deb artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: libvermell-deb-*
          merge-multiple: true
          path: debs

      - name: Install dependencies (apt-ftparchive, gpg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: Assemble apt repository layout
        run: |
          set -euo pipefail
          for a in amd64 arm64 armhf; do
            mkdir -p "apt-repo/pool/main/v/vermell/$a"
            mkdir -p "apt-repo/dists/stable/main/binary-$a"
          done
          for a in amd64 arm64 armhf; do
            cp debs/*_${a}.deb "apt-repo/pool/main/v/vermell/$a/"
          done

      - name: Generate Packages indexes
        run: |
          set -euo pipefail
          cd apt-repo
          for a in amd64 arm64 armhf; do
            apt-ftparchive packages "pool/main/v/vermell/$a" > "dists/stable/main/binary-$a/Packages"
            gzip -9 -kf "dists/stable/main/binary-$a/Packages"
          done

      - name: Generate Release file
        run: |
          set -euo pipefail
          cd apt-repo
          apt-ftparchive release \
            -o APT::FTPArchive::Release::Origin="vermellcc" \
            -o APT::FTPArchive::Release::Label="vermell apt repository" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64 armhf" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="Vermell C++20 web framework packages" \
            dists/stable > dists/stable/Release

      - name: Sign Release (optional, requires APT_GPG_PRIVATE_KEY secret)
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # skip signing when the secret is not configured (no error)
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::notice::APT_GPG_PRIVATE_KEY not set - apt repo published UNSIGNED (use [trusted=yes])"
            exit 0
          fi
          cd apt-repo
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_OPT=(gpg --batch --yes)
          if [ -n "$APT_GPG_PASSPHRASE" ]; then
            GPG_OPT+=(--pinentry-mode loopback --passphrase "$APT_GPG_PASSPHRASE")
          fi
          "${GPG_OPT[@]}" --clearsign -o dists/stable/InRelease dists/stable/Release
          "${GPG_OPT[@]}" --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          gpg --armor --export > vermell-apt-key.asc
          gpg --export > vermell-apt-key.gpg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apt-repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
